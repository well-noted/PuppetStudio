<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puppet Studio</title><style>
:root{--ink:#253247;--muted:#6e7c92;--line:#dde3ed;--accent:#6554d6;--button:#6554d6;--bg:#f5f7fb;--surface:#fff;--nav:#fafbfe;--selected:#ece9ff;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif}header{background:var(--surface);height:76px;display:flex;align-items:center;gap:18px;padding:0 25px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.brand{font-size:21px;font-weight:750}.brand small{font-size:10px;display:block;color:var(--muted);letter-spacing:.1em}#name{flex:1;border:0;border-left:1px solid var(--line);min-width:80px}button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:9px 13px;border-radius:8px;cursor:pointer}button:hover{color:var(--accent);border-color:var(--accent)}button.primary{background:var(--button);color:white;border-color:var(--button)}button.danger{color:#ae384b}aside{position:fixed;top:76px;bottom:0;width:210px;padding:18px 12px;background:var(--nav);border-right:1px solid var(--line)}aside button{display:block;width:100%;border:0;text-align:left;margin:4px 0;padding:13px;background:transparent}aside button.active{background:var(--selected);color:var(--accent);font-weight:650}aside p{font-size:12px;line-height:1.6;color:var(--muted);padding:10px}main{margin-left:210px;padding:25px;max-width:1650px}h1{font-size:26px;margin:0 0 8px}h2{font-size:18px;margin:0 0 13px}h3{font-size:15px;margin:14px 0 8px}.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:19px;margin:18px 0}.muted,small{color:var(--muted);line-height:1.5}label{display:block;font-size:12px;color:var(--muted);margin:9px 0 5px}input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;color:var(--ink);background:var(--surface)}textarea{min-height:75px;resize:vertical}input[type=checkbox]{width:auto}input[type=color]{height:38px;padding:3px}input[type=file]{font-size:12px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>input,.row>select{flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.triple{grid-template-columns:repeat(3,minmax(0,1fr))}.studio{display:grid;grid-template-columns:minmax(400px,1fr) 310px;gap:18px}details{border:1px solid var(--line);border-radius:8px;padding:13px;margin:12px 0}summary{font-weight:600;cursor:pointer}.empty{border:1px dashed var(--line);border-radius:8px;padding:25px;text-align:center;color:var(--muted)}.clip{padding:17px 0;border-bottom:1px solid var(--line)}.clipline{border:1px solid var(--line);border-radius:7px;padding:8px;display:flex;gap:7px;align-items:center;margin:6px 0}.clipline span{flex:1}.clipline button{padding:3px 7px}canvas{display:block;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:8px;touch-action:none}.mini{max-height:220px;max-width:170px;background:repeating-conic-gradient(#eef0f5 0% 25%,white 0% 50%) 50%/16px 16px}.log{background:#222c3d;color:#e5eaf3;font:12px ui-monospace,monospace;white-space:pre-wrap;max-height:400px;overflow:auto;padding:15px;border-radius:8px}#toast{display:none;position:fixed;right:25px;bottom:25px;background:#253247;color:white;padding:15px 22px;border-radius:10px;max-width:520px;white-space:pre-wrap;box-shadow:0 8px 22px #0002;z-index:10}#toast.error{background:#913345}#status{font-size:12px;color:var(--muted)}video,audio{width:100%;max-height:360px}.trim-controls{padding:14px;background:var(--bg);border-radius:8px;margin-top:10px}.trim-controls input[type=range]{padding:0;accent-color:var(--accent)}dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;max-width:800px;width:90vw}dialog::backdrop{background:#22304788}#anatomy{width:auto;max-width:100%;max-height:60vh;object-fit:contain;aspect-ratio:auto}@media(max-width:1100px){.studio{grid-template-columns:1fr}}@media(max-width:720px){header{height:auto;padding:12px;flex-wrap:wrap}aside{position:static;width:auto;display:flex;padding:4px}aside button{font-size:11px;padding:8px}aside p{display:none}main{margin:0;padding:15px}.grid{grid-template-columns:1fr}.studio{display:block}}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.step{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.step>div{flex:1}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
:root[data-theme="dark"]{color-scheme:dark;--ink:#e5eaf3;--muted:#a8b4c8;--line:#3d4759;--accent:#b3a5ff;--bg:#111722;--surface:#1b2331;--nav:#151d29;--selected:#302945}a{color:var(--accent)}
</style><body><header><div class="brand">Puppet Studio<small>LOCAL AUTHORING · PUBLIC ALPHA</small></div><input id="name" aria-label="Project name" oninput="P.name=this.value;changed()"><span id="status">Loading…</span><button id="globalJob" hidden onclick="tab('Render queue')" aria-live="polite"></button><button id="themeToggle" onclick="toggleTheme()" aria-pressed="false" title="Switch to dark mode">Dark mode</button><button onclick="saveProject()">Save</button><button onclick="exportProject()">Save & export</button></header><aside id="nav"></aside><main id="main"></main><div id="toast" role="status" aria-live="polite"></div><dialog id="review"><h2>Review detected anatomy</h2><p class="muted">Blue = bust. Red = mouth. Orange = nose/jaw. Approve only when these match the drawing. Failed detection needs a calibrated profile; no mouth box is guessed.</p><canvas id="anatomy"></canvas><div class="row"><button class="primary" onclick="document.getElementById('review').close();act('approve',{speaker:speakerId})">Approve anatomy</button><button onclick="document.getElementById('review').close()">Close</button></div></dialog>
<script>
const TOKEN='__TOKEN__',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let P,revision=null,meta={},job=null,tabName='Recording',speakerId=null,prodId=null,actorId=null,dirty=false,finishedJob=null,images={},regions=[],drag=null,drawSeq=0;let machine=null,firstLoad=true;const tabs=['Getting started','Recording','Speakers & art','Clips','Productions','Render queue','Renders','Advanced'];let renderItems=[],renderFilter='',renderType='',renderHistory=false,gallerySeq=0;const sourcePlayers=new Map();let transcriptData=null,referenceClipId=null,gesturePlayback=null;
function applyTheme(theme,persist=false){theme=theme==='dark'?'dark':'light';document.documentElement.dataset.theme=theme;let button=$('themeToggle');button.textContent=theme==='dark'?'Light mode':'Dark mode';button.setAttribute('aria-pressed',String(theme==='dark'));button.title='Switch to '+(theme==='dark'?'light':'dark')+' mode';if(persist){try{document.cookie='puppet_studio_theme='+theme+'; Path=/; Max-Age=31536000; SameSite=Strict'}catch(e){}}}
function initializeTheme(){let theme;try{theme=document.cookie.split(';').map(x=>x.trim()).find(x=>x.startsWith('puppet_studio_theme='))?.split('=')[1]}catch(e){}if(!['light','dark'].includes(theme))theme=window.matchMedia?.('(prefers-color-scheme: dark)')?.matches?'dark':'light';applyTheme(theme)}
function toggleTheme(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark',true)}
const STYLE_PRESETS=[['Editorial line art','Editorial line art, clean black contours, flat muted colors, natural adult proportions, minimal facial shading, no photorealistic texture.'],['Simple cartoon','Simple flat cartoon illustration, clear black outlines, restrained colors, natural adult proportions and minimal facial detail.'],['Ink illustration','Black and white ink illustration, clean sparse lines, clear facial landmarks, no crosshatching across the mouth or eyes.']];
function artCreationOptions(){return `<div class="card"><h3>Choose your artwork route</h3><p><strong>Existing artwork:</strong> upload one neutral full figure above.<br><strong>Generate here:</strong> add a reference, choose a style, configure an image provider under Advanced, then generate a draft below.<br><strong>Use another assistant:</strong> Export art prompts, generate elsewhere, then upload the PNG.</p><label>Style preset</label><select onchange="if(this.value)put(P.settings,'style',STYLE_PRESETS[+this.value][1])"><option value="">Custom / current description</option>${STYLE_PRESETS.map((x,i)=>`<option value="${i}">${esc(x[0])}</option>`).join('')}</select>${field('Style description (editable)','cfg','style','textarea')}<small>New drafts use this style. Existing artwork is not changed. API keys stay in local environment variables.</small></div>`}
function guideSteps(){return [{title:'Import a recording',text:'Use a video or audio file. Original media stays unchanged.',tab:'Recording',done:!!P.media},{title:'Create or import a transcript',text:'Local transcription is free; import JSON/SRT or use an optional provider.',tab:'Recording',done:!!P.transcript},{title:'Review a clip',text:'Choose boundaries, speaker and context. A clip can be reused across productions.',tab:'Clips',done:P.clips.some(c=>c.reviewed&&c.speaker)},{title:'Prepare the speaker artwork',text:'Upload or generate a figure, detect anatomy and approve the visible landmarks.',tab:'Speakers & art',done:P.speakers.some(s=>s.asset&&s.approved)},{title:'Compose a production',text:'A production is a scene layout plus a list of clips to render.',tab:'Productions',done:P.productions.some(p=>p.clips.length)},{title:'Test, then render',text:'Check a 12-second speaking preview before rendering the full production. Outputs appear under Renders.',tab:'Render queue',done:false}]}
function setupPage(){let steps=guideSteps(),next=steps.find(s=>!s.done);return `<h1>Make your first production</h1><p class="muted">Start with a recording and create a reviewed illustrated speaker. You can return to this guide at any time.</p><div class="card"><h2>Computer and animation tools</h2>${animationSetupStatus()}<div id="machineSummary">${machine?machineSummary():'Checking computer capabilities…'}</div><div class="row"><button onclick="loadMachine()">Refresh computer check</button><button onclick="act('discover-tools')">Find and verify existing animation tools</button></div><details><summary>Optional: install missing tools (existing environments can be reused)</summary><p>Windows x64: Studio can install FFmpeg, local transcription/anatomy packages and a separate SadTalker environment with model weights. This downloads several GiB and needs at least 15 GiB free during setup. No administrator access is needed. Existing external environments are not modified. This installation recipe is experimental until tested on a clean Windows computer.</p><p>Packages/models come from PyPI, Astral/Python standalone distributions, PyTorch, Gyan's FFmpeg builds and the upstream SadTalker/facexlib/GFPGAN releases. Their licenses continue to apply. Third-party packages execute during installation.</p><button class="primary" onclick="act('install-tools',{animation:true})">Download and set up local animation</button><button onclick="act('install-tools',{animation:false})">Install transcription and composition tools only</button><p class="muted">Progress is shown in Render queue. Interrupted files are not activated; completed downloads can be reused. A speaking preview is still required after startup verification.</p></details><div class="row"><button onclick="act('diagnose',{model:true})">Verify configured model environment</button></div></div><div class="card"><h2>Your next steps</h2>${steps.map((step,i)=>`<div class="step"><strong>${step.done?'Done':i+1}</strong><div><strong>${esc(step.title)}</strong><p class="muted">${esc(step.text)}</p></div><button onclick="tab('${step.tab}')">Open</button></div>`).join('')}<div class="row" style="margin-top:14px"><button class="primary" onclick="tab('${next.tab}')">Continue: ${esc(next.title)}</button><button onclick="put(P.settings,'guide_dismissed',true);saveProject();tab('Recording')">Dismiss startup guide</button></div></div>`}
function animationSetupStatus(){let configured=P.settings.sadtalker_repo&&P.settings.sadtalker_python;return `<p class="muted">${configured?'Animation paths are configured for this project. You can reuse the existing environment; installing another one is optional. Verify configured tools if the paths or packages changed.':'This project has no animation paths configured yet. That does not mean your computer lacks them. Find and verify existing tools first; install only if none are usable.'}</p>`}
function machineSummary(){return `<p><strong>${esc(machine.platform)} / ${esc(machine.architecture)}</strong><br>Python ${esc(machine.python_version)}: <code>${esc(machine.python)}</code><br>Managed tools: <code>${esc(machine.tools_home)}</code><br>${machine.free_gib} GiB free</p><p>${machine.gpus.length?machine.gpus.map(g=>esc(g.name)+' · '+g.vram_mib+' MiB VRAM').join('<br>'):'No NVIDIA GPU detected. Composition and CPU transcription remain available; this build requires CUDA for local lip sync.'}</p><p>FFmpeg: ${machine.ffmpeg?'Found':'Missing'} · FFprobe: ${machine.ffprobe?'Found':'Missing'}</p><p class="muted">${esc(machine.note)}</p><button onclick="applyMachinePreset()">Apply suggested ${esc(machine.suggested_preset)} preset</button>`}
async function loadMachine(){try{machine=await api('machine');if(tabName==='Getting started')$('machineSummary').innerHTML=machineSummary()}catch(e){if(tabName==='Getting started')$('machineSummary').textContent=e.message}}
function applyMachinePreset(){if(!machine)return;P.settings.chunk_seconds=machine.suggested_preset==='low-memory'?40:75;P.settings.whisper_model=machine.suggested_preset==='low-memory'?'base':'small';if(machine.suggested_preset==='composition')P.settings.backend='still';changed();toast('Preset applied to unsaved settings. Chunk length controls recovery and clip splitting; it does not guarantee GPU memory fit. Verify a short preview.');}
function hfSettings(){return `<details><summary>Hugging Face: downloads and hosted transcription</summary><h3>Model download authentication</h3><p class="muted">Optional HF_TOKEN authenticates local model downloads. Speech is still transcribed on this computer when Local Whisper is selected.</p><label>Download token (session only)</label><input id="hfDownloadToken" type="password" autocomplete="off"><button onclick="setCredential('HF_TOKEN','hfDownloadToken')">Use token this session</button><button onclick="clearCredential('HF_TOKEN')">Clear session token</button><h3>Hosted transcription</h3><p class="muted">Select Hugging Face hosted ASR above to send audio in 60-second chunks. Account access/credits may be needed. Requires complete returned timestamps for captions; text-only results are retained but not assigned invented timing.</p>${field('ASR model (owner/model)','cfg','hf_model')}${field('Hosted token environment-variable name','cfg','hf_key_env')}<label>Hosted token (session only; Inference Providers permission)</label><input id="hfHostedToken" type="password" autocomplete="off"><button onclick="setCredential(P.settings.hf_key_env,'hfHostedToken')">Use token this session</button><button onclick="clearCredential(P.settings.hf_key_env)">Clear session token</button><p class="muted">Tokens stay in the server process and are inherited by its workers. They are not saved in project JSON, exports or logs. Restarting Studio clears tokens entered here. Both fields use HF_TOKEN by default, so setting either updates the same credential; choose another hosted variable name to separate them. Use environment variables before launch for persistent setup.</p></details>`}
async function setCredential(name,id){let input=$(id);try{if(dirty&&!await saveProject(true))return;await api('credential',{name,value:input.value});input.value='';toast('Credential applied for this Studio session. No token was saved to the project.')}catch(e){toast(e.message,true)}}
async function clearCredential(name){try{await api('credential',{name,value:''});toast('Session credential cleared.')}catch(e){toast(e.message,true)}}
function toast(t,error=false){$('toast').textContent=t;$('toast').className=error?'error':'';$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',error?13000:5000)}
async function api(route,data){let r=await fetch('/api/'+route,{method:data===undefined?'GET':'POST',headers:{'X-Studio-Token':TOKEN,'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function file(p){return '/files/'+p.split('/').map(encodeURIComponent).join('/')+'?token='+TOKEN+'&v='+Date.now()}
function changed(){dirty=true;$('status').textContent='Unsaved changes'}
async function saveProject(quiet=false){$('status').textContent='Saving…';try{let saved=await api('save',{project:P,revision});revision=saved.revision;dirty=false;$('status').textContent='Saved '+new Date().toLocaleTimeString();if(!quiet)toast('Saved in the project folder.');return true}catch(e){$('status').textContent='Save failed';toast(e.message,true);return false}}
async function exportProject(){if(await saveProject(true)){await act('export',{},false);toast('Saved and exported directly to the project’s exports folder.')}}
async function refresh(){let d=await api('state');P=d.project;revision=d.revision;transcriptData=null;meta=d.meta;if(firstLoad){firstLoad=false;if(!P.media&&!P.speakers.length&&!P.settings.guide_dismissed)tabName='Getting started';}job=d.job;updateJob();$('name').value=P.name;if(!dirty)$('status').textContent='Saved';renderPage()}
async function act(name,args={},saveFirst=true,confirmed=false){try{if(name==='import-media'&&P.media&&!confirmed&&!confirm('Replace recording and clear transcript/clip assignments in this project?'))return;if(saveFirst&&dirty&&!await saveProject(true))return;let d=await api('action',{action:name,args});if(d.job){job=d.job;finishedJob=null;updateJob();toast('Started '+name+'. Progress is in Render queue.');if(name==='render')tab('Render queue')}else{await refresh();toast('Done: '+name)}}catch(e){toast(e.message,true)}}
function gestureUploadId(filename,poses=[]){let base=filename.replace(/\.[^.]+$/,'').replace(/[^A-Za-z0-9_-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,55)||'gesture';if(['character','display','alpha','profile','reference','breath','closed','inference_bust'].includes(base))base='gesture_'+base;let key=base,n=2;while(poses.some(p=>p.id===key))key=base+'_'+n++;return key}
async function upload(input,name,args={}){let f=input.files[0];if(!f)return;if(args.kind==='pose'||name==='prepare-gesture'){if(!args.pose?.trim()){let key=gestureUploadId(f.name,model('speaker')?.poses||[]);args={...args,pose:key};if($('poseName'))$('poseName').value=key;}if(!/^[A-Za-z0-9_-]{1,60}$/.test(args.pose)){toast('Gesture ID: entered '+JSON.stringify(args.pose)+'. Use 1–60 letters, numbers, underscores or hyphens; e.g. explain.',true);input.value='';return}}if(name==='import-media'&&P.media&&!confirm('Replace recording and clear transcript/clip assignments in this project?')){input.value='';return}try{if(dirty&&!await saveProject(true))return;let source=await new Promise((resolve,reject)=>{let x=new XMLHttpRequest();x.open('POST','/api/upload');x.setRequestHeader('X-Studio-Token',TOKEN);x.setRequestHeader('X-Filename',encodeURIComponent(f.name));x.upload.onprogress=e=>{if(e.lengthComputable)$('status').textContent='Uploading '+Math.round(e.loaded/e.total*100)+'%'};x.onload=()=>{let d=JSON.parse(x.responseText);x.status===200?resolve(d.path):reject(Error(d.error))};x.onerror=()=>reject(Error('Upload failed'));x.send(f)});await act(name,{...args,path:source},false,name==='import-media')}catch(e){toast(e.message,true)}input.value=''}
let gestureMaskPath=null,gestureMaskSpeaker=null;
async function chooseGestureMask(input){let f=input.files[0];if(!f)return;try{let response=await fetch('/api/upload',{method:'POST',headers:{'X-Studio-Token':TOKEN,'X-Filename':encodeURIComponent(f.name)},body:f});let data=await response.json();if(!response.ok)throw Error(data.error);gestureMaskPath=data.path;gestureMaskSpeaker=speakerId;$('gestureMaskStatus').textContent='Mask selected: '+f.name}catch(e){toast(e.message,true)}input.value=''}
function prepareGesture(input){let region=['gestureLeft','gestureTop','gestureRight','gestureBottom'].map(id=>+$(id).value);upload(input,'prepare-gesture',{speaker:speakerId,pose:$('poseName').value,region,feather:+$('gestureFeather').value,mask:gestureMaskSpeaker===speakerId?gestureMaskPath:null})}
function generateAsset(kind,method='local'){let args={speaker:speakerId,kind,method};if(kind==='pose'){args.pose=$('poseName').value;args.description=$('poseDescription').value}act('generate-asset',args)}
function assetDraftControls(s){return `<p class="muted">API edits use Advanced provider settings and may incur charges. The local mask is a narrow chest proposal, not automatic body segmentation: inspect it for chair, hair or hand overlap before importing. The local closed-mouth proposal compresses the existing lip opening. Local bust extraction preserves the existing mouth; API lip edits can change it. Check lip and gesture alignment too.</p>`+(s.asset_drafts||[]).map(d=>`<div class="card"><strong>${esc(d.kind)} ${esc(d.pose||'')} draft</strong><p><code>${esc(d.path)}</code></p>${d.preparation?`<p class="muted">Protected pixels changed: ${d.preparation.protected_changed_pixels}. Review the arm region before importing.</p>`:''}<div class="row"><a href="${file(d.path)}" target="_blank" rel="noopener">Open draft</a><a href="${file(d.path)}&download=1" download>Download</a><button data-draft-path="${esc(d.path)}" onclick="act('import-asset-draft',{speaker:speakerId,path:this.dataset.draftPath})">Import reviewed draft</button></div></div>`).join('')}
function referenceClipSelector(s){if(!P.media?.video)return '<p class="muted">Import video to capture a reference from a clip.</p>';let clips=P.clips.filter(c=>c.speaker===s.id);return `<label>Or capture from a clip assigned to this speaker</label><select id="referenceClipChoice" onchange="openReferenceClip(this.value)">${options(clips,null,'Choose a speaker clip')}</select>${clips.length?'':'<p class="muted">Assign a clip to this speaker in Clips first.</p>'}<div id="referenceClipPlayer"></div><button onclick="captureReferenceClip()">Capture this frame</button><p id="referenceCaptureTime" class="muted">Choose a clip, pause on a clear face, then capture. No timecode entry needed.</p>`}
function openReferenceClip(id){stopSourcePlayers();referenceClipId=id;let c=P.clips.find(c=>c.id===id&&c.speaker===speakerId);if(!c)return;let video=document.createElement('video');video.controls=true;video.preload='metadata';video.src=file(P.media.path);$('referenceClipPlayer').replaceChildren(video);sourcePlayers.set(id,{video,timer:null,lo:c.start,hi:c.end});video.onloadedmetadata=()=>playSourceRange(id);video.onplay=()=>scheduleSourceStop(id);video.onpause=()=>clearTimeout(sourcePlayers.get(id)?.timer);video.onseeking=()=>clearTimeout(sourcePlayers.get(id)?.timer);video.onseeked=()=>scheduleSourceStop(id);video.onratechange=()=>scheduleSourceStop(id);video.ontimeupdate=()=>{scheduleSourceStop(id);$('referenceCaptureTime').textContent='Current frame: '+video.currentTime.toFixed(2)+' s'};}
function captureReferenceClip(){let c=P.clips.find(c=>c.id===referenceClipId&&c.speaker===speakerId),state=sourcePlayers.get(referenceClipId);if(!c||!state){toast('Choose a clip assigned to this speaker first.',true);return}let video=state.video;video.pause();if(video.readyState<2||video.seeking){toast('Wait for the selected frame to finish loading before capturing.',true);return}if(video.currentTime<c.start||video.currentTime>c.end){toast('Select a frame inside the associated clip.',true);return}act('reference-frame',{speaker:speakerId,clip:c.id,seconds:video.currentTime})}
function referenceControls(s){if(!s.reference)return '<p class="muted">No reference image saved yet.</p>';let url=file(s.reference);return `<p class="muted">Saved in project: <code>${esc(s.reference)}</code></p><a href="${url}" target="_blank" rel="noopener"><img class="mini" src="${url}" alt="Reference image for ${esc(s.name)}"></a><div class="row"><a href="${url}" target="_blank" rel="noopener">Open image</a><a href="${url}&download=1" download>Download reference</a></div>`}
function options(items,selected,empty=''){return (empty?`<option value="">${esc(empty)}</option>`:'')+items.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name||x.title||x.id)}</option>`).join('')}
function get(obj,key){return key.split('.').reduce((o,k)=>o[k],obj)}function put(obj,key,v){let a=key.split('.');for(let k of a.slice(0,-1))obj=obj[k];obj[a.at(-1)]=v;if(P.clips.includes(obj)&&key!=='reviewed'){obj.reviewed=['start','end'].includes(key);let review=$('review_'+obj.id);if(review)review.checked=obj.reviewed;}if(P.clips.includes(obj)&&['start','end'].includes(key)){syncTrim(obj.id);updateClipTranscript(obj.id);}if(P.clips.includes(obj))updateClipReview();changed();if(tabName==='Productions')drawStage()}
function model(type){if(type==='cfg')return P.settings;if(type==='scene')return production().scene;if(type==='actor')return activeActor();if(type==='prod')return production();if(type.startsWith('clip:'))return P.clips.find(c=>c.id===type.slice(5));if(type==='speaker')return P.speakers.find(s=>s.id===speakerId)}
function field(label,type,key,kind='text',lo=null,hi=null){let v=get(model(type),key),range=lo!==null?` min="${lo}" max="${hi}" step="any"`:'';let handler=`put(model('${type}'),'${key}',${kind==='number'?'+this.value':kind==='checkbox'?'this.checked':'this.value'})`;if(kind==='checkbox')return `<label><input type="checkbox" ${type.startsWith('clip:')&&key==='reviewed'?`id="review_${esc(type.slice(5))}"`:""} ${v?'checked':''} onchange="${handler}">${label}</label>`;if(kind==='textarea')return `<label>${label}</label><textarea oninput="${handler}">${esc(v)}</textarea>`;return `<label>${label}${lo!==null?` (${lo}–${hi})`:''}</label><input ${type.startsWith('clip:')&&['start','end'].includes(key)?`id="clip_${esc(type.slice(5))}_${key}"`:""} type="${kind}" value="${esc(v)}"${range} on${kind==='number'?'change':'input'}="${handler}">`}
function select(label,type,key,values){return `<label>${label}</label><select onchange="put(model('${type}'),'${key}',this.value)">${values.map(x=>`<option value="${x[0]}" ${get(model(type),key)===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`}
function tab(t){tabName=t;renderPage()}function production(){return P.productions.find(p=>p.id===prodId)}function activeActor(){return production()?.scene.actors.find(a=>a.id===actorId)}
function renderPage(){try{renderPageUnsafe()}catch(e){console.error(e);$('main').innerHTML='<div class="card"><h1>This page could not open</h1><p>'+esc(e.message)+'</p><p>Your saved project has not been deleted. Other tabs remain available.</p><button onclick="tab(\'Recording\')">Return to Recording</button></div>';toast(e.message,true)}}
function renderPageUnsafe(){stopSourcePlayers();$('nav').innerHTML=tabs.map(t=>`<button class="${tabName===t?'active':''}" onclick="tab('${t}')">${t}</button>`).join('')+'<p>Projects stay on this computer. API calls happen only when you choose provider-backed actions.</p>';let html='';
if(tabName==='Getting started'){html=setupPage()}
if(tabName==='Recording'){html=`<h1>Start with a recording</h1><p class="muted">Import video or audio once; reuse its clips across productions.</p><div class="card"><h2>Recording</h2><label>Local path (quotes accepted; large files need no upload)</label><div class="row"><input id="mediaPath" placeholder="C:\\path\\recording.mp4"><button onclick="act('import-media',{path:$('mediaPath').value})">Import path</button></div><label>Or upload recording</label><input type="file" accept="video/*,audio/*" onchange="upload(this,'import-media')">${P.media?`<p class="muted">${esc(P.media.path)} · ${P.media.duration.toFixed(1)} seconds</p><${P.media.video?'video':'audio'} controls src="${file(P.media.path)}"></${P.media.video?'video':'audio'}>`:'<p class="empty">No recording yet.</p>'}</div><div class="card"><h2>Transcript</h2><p class="muted">Local Whisper uses CPU, leaving the GPU for animation. First use downloads the model. Speaker identities are assigned during clip review.</p><div class="row"><button class="primary" onclick="act('transcribe')">Transcribe recording</button><button onclick="act('handoff')">Export assistant prompt pack</button></div><label>Import timestamped JSON or SRT</label><input type="file" accept=".json,.srt" onchange="upload(this,'import-transcript')"><p class="muted">${P.transcript?'Transcript: '+esc(P.transcript):'No transcript yet.'}</p><details><summary>Use your own chat interface</summary><p>Export the handoff pack, then attach ASSISTANT_PROMPT.md and transcript.json to your preferred assistant. The prompt tells it to ask for missing source files, use real timestamps and avoid inventing context. Import its clips JSON in the Clips tab. No API key is needed for this route.</p></details></div>`}
if(tabName==='Speakers & art'){gestureMaskPath=null;gestureMaskSpeaker=null;if(!P.speakers.some(s=>s.id===speakerId))speakerId=P.speakers[0]?.id;let s=model('speaker');html=`<h1>Speakers and artwork</h1><p class="muted">One clean figure per PNG; each speaker gets their own assets and anatomy.</p><div class="card"><div class="grid"><div><label>Name</label><input id="speakerName"></div><div><label>Title / role</label><input id="speakerTitle"></div></div><button style="margin-top:12px" class="primary" onclick="act('add-speaker',{name:$('speakerName').value,title:$('speakerTitle').value})">Add speaker</button></div><div class="card"><select onchange="speakerId=this.value;renderPage()">${options(P.speakers,speakerId,'Choose speaker')}</select>${s?`<div class="row" style="margin-top:15px">${s.asset?`<img class="mini" src="${file(s.display||s.asset)}" alt="Neutral figure">`:''}<div><h2>${esc(s.name)}</h2><p class="muted">${esc(s.title)}</p><small>${s.approved?'Anatomy approved':s.profile?'Anatomy awaiting review':'Needs anatomy'}</small></div></div><div class="grid"><div><label>Neutral figure (one full figure, not an atlas)</label><input type="file" accept="image/*" onchange="upload(this,'import-asset',{speaker:speakerId,kind:'neutral'})"></div><div><label>Reference photo (optional)</label><input type="file" accept="image/*" onchange="upload(this,'import-asset',{speaker:speakerId,kind:'reference'})"><div class="row"><input id="frameTime" type="number" value="0" min="0" style="width:95px"><button onclick="act('reference-frame',{speaker:speakerId,seconds:+$('frameTime').value})">Extract frame</button></div>${referenceClipSelector(s)}${referenceControls(s)}</div></div><div class="row" style="margin-top:15px"><button onclick="act('calibrate',{speaker:speakerId})">Detect anatomy</button><button onclick="reviewAnatomy()">Review / approve</button><button onclick="act('handoff')">Export art prompts</button></div>${artCreationOptions()}<details><summary>Optional AI art draft</summary><p class="muted">Uses the image provider configured under Advanced. Sends the reference image; charges may apply. A draft still needs likeness review and calibration.</p><button onclick="act('generate-art',{speaker:speakerId})">Generate draft</button>${s.draft?`<p><a href="${file(s.draft)}" target="_blank">Review draft PNG</a></p><button onclick="act('import-asset',{speaker:speakerId,kind:'neutral',path:model('speaker').draft})">Import reviewed draft</button>`:''}</details><details ${s.asset_drafts?.length?'open':''}><summary>Additional gestures & torso breathing</summary><p class="muted">Poses must match the neutral canvas and keep the head, chair and legs fixed. Torso breathing needs an explicit mask; without it, breathing is disabled so the chair stays still.</p><label>Gesture ID (optional for uploads; defaults to filename)</label><input id="poseName" placeholder="explain"><small>1–60 letters, numbers, underscores or hyphens. Use explain for explain.png.</small><label>Describe gesture for generation</label><input id="poseDescription" placeholder="One hand open, palm upward, making a small explanatory gesture"><button onclick="generateAsset('pose','api')">Generate gesture draft (API)</button><details><summary>Prepare gesture locally: preserve neutral pixels</summary><p class="muted">Upload a same-size pose. Only the region below can change; the head and lower body come from the neutral master. This copies pixels, not anatomy: inspect arm boundaries and torso texture before importing the draft. Canvas mismatches are rejected.</p><div class="grid"><div><label>Left X (0.08–0.95)</label><input id="gestureLeft" type="number" min="0.08" max="0.95" step="0.01" value="0.08"></div><div><label>Top Y (0.25–0.66)</label><input id="gestureTop" type="number" min="0.25" max="0.66" step="0.01" value="0.25"></div><div><label>Right X (0.08–0.95)</label><input id="gestureRight" type="number" min="0.08" max="0.95" step="0.01" value="0.95"></div><div><label>Bottom Y (0.25–0.66)</label><input id="gestureBottom" type="number" min="0.25" max="0.66" step="0.01" value="0.66"></div></div><label>Feather inside region (0–64 pixels)</label><input id="gestureFeather" type="number" min="0" max="64" value="8"><label>Optional grayscale arm mask (same canvas; white allows changes)</label><input type="file" accept=".png" onchange="chooseGestureMask(this)"><p id="gestureMaskStatus" class="muted">No mask: the selected rectangle can change.</p><button onclick="gestureMaskPath=null;gestureMaskSpeaker=null;$('gestureMaskStatus').textContent='No mask: the selected rectangle can change.'">Clear mask</button><label>Choose pose to prepare (local; no API)</label><input type="file" accept="image/*" onchange="prepareGesture(this)"></details><label>Gesture image</label><input type="file" accept="image/*" onchange="upload(this,'import-asset',{speaker:speakerId,kind:'pose',pose:$('poseName').value})"><p class="muted">${s.poses.map(p=>esc(p.id)).join(', ')||'No additional poses yet.'}</p><label>Torso-only grayscale breathing mask</label>${s.breath?`<p class="muted">Breathing mask applied: <a href="${file(s.breath)}" target="_blank" rel="noopener">View mask</a>. Set breathing amplitude under Productions → Motion & gestures.</p>`:'<p class="muted">No breathing mask applied. Generate a proposal, then review and import its draft below.</p>'}<button onclick="generateAsset('breath')">Generate mask proposal (local)</button><input type="file" accept=".png" onchange="upload(this,'import-asset',{speaker:speakerId,kind:'breath'})"><label>Optional closed-mouth rest (same full canvas)</label><button onclick="generateAsset('closed')">Generate closed-mouth proposal (local)</button><button onclick="generateAsset('closed','api')">Redraw lips (API)</button><input type="file" accept="image/*" onchange="upload(this,'import-asset',{speaker:speakerId,kind:'closed'})"><label>Optional inference-only speaking bust</label><button onclick="generateAsset('inference-bust')">Extract padded bust (local)</button><button onclick="generateAsset('inference-bust','api')">Part lips in bust (API)</button><input type="file" accept=".png" onchange="upload(this,'import-asset',{speaker:speakerId,kind:'inference-bust'})"><small>For tight-lipped art: same calibrated square bust canvas, gently parted lips. The full-body master stays unchanged.</small>${assetDraftControls(s)}</details><details><summary>Import calibrated anatomy</summary><input type="file" accept=".json" onchange="upload(this,'import-asset',{speaker:speakerId,kind:'profile'})"><p class="muted">If detection fails on stylized art, import a reviewed profile.json instead of guessing.</p></details>`:'<p class="empty">Add a speaker first.</p>'}</div>`}
if(tabName==='Clips'){html=`<h1>Review your clips</h1><p class="muted">Automatic proposals need review. Set source boundaries, identify the speaker and add supported context.</p><div class="card"><div class="row"><button class="primary" onclick="propose()">Suggest clips</button><button onclick="addClip()">Add clip</button></div><label>Import clips JSON from your assistant</label><input type="file" accept=".json" onchange="upload(this,'import-clips')"><p id="clipReviewStats" role="status">${clipReviewStats()}</p><p class="muted">Changing boundaries automatically checks review. Confirm the speaker and context too; you can uncheck any clip.</p>${P.clips.map(c=>{let t='clip:'+c.id;return `<div class="clip"><div class="row"><h2 style="flex:1">${esc(c.title)}</h2><strong id="reviewStatus_${esc(c.id)}">${c.reviewed?'Approved':'Not approved'}</strong><button class="danger" onclick="deleteClip('${c.id}')" aria-label="Delete clip">×</button></div>${field('Clip title',t,'title')}<div class="grid triple"><div>${field('Start seconds',t,'start','number',0,864000)}</div><div>${field('End seconds',t,'end','number',0,864000)}</div><div><label>Speaker</label><select onchange="put(model('${t}'),'speaker',this.value||null)">${options(P.speakers,c.speaker,'Assign speaker')}</select></div></div>${field('Intro context (optional)',t,'intro','textarea')}<div class="grid"><div>${field('Group related speech parts',t,'group')}</div><div>${field('Reviewed boundaries, speaker and context',t,'reviewed','checkbox')}<button onclick="playClip('${c.id}')">Review source clip</button><button id="transcriptButton_${c.id}" onclick="toggleClipTranscript('${c.id}')" aria-expanded="false" aria-controls="transcript_${c.id}">Show transcript</button></div></div><div id="transcript_${c.id}" class="card" hidden><p id="transcriptNote_${c.id}" class="muted"></p><div id="transcriptText_${c.id}" style="white-space:pre-wrap;line-height:1.6"></div></div><div id="player_${c.id}"></div></div>`}).join('')||'<p class="empty">Transcribe first, then suggest or add clips.</p>'}</div>`}
if(tabName==='Productions'){if(!P.productions.some(p=>p.id===prodId))prodId=P.productions[0]?.id;let p=production();if(p&&!p.scene.actors.some(a=>a.id===actorId))actorId=p.scene.actors[0]?.id;html=`<h1>Compose once, reuse across clips</h1><p class="muted">A production is one scene plus its ordered clips. Solo and shared scenes can coexist in the same project.</p><div class="card"><div class="row"><select onchange="prodId=this.value;renderPage()">${options(P.productions,prodId,'Choose production')}</select><button onclick="newProduction()">New</button><button onclick="duplicateProduction()">Duplicate</button><button class="danger" onclick="deleteProduction()">Delete</button></div></div>${p?`<div class="studio"><div><div class="card"><canvas id="stage" width="1280" height="720" aria-label="Scene editor"></canvas><p class="muted"><small>Drag figures, labels, subtitles or the light. Corner handles resize figures or text guides. Canvas shows illustrative shading; the exact snapshot uses the final renderer.</small></p><div class="row"><button onclick="act('snapshot',{production:prodId})">Exact rendered snapshot</button><button onclick="window.open(file('work/snapshot.png'),'_blank')">Open snapshot</button></div><label><input type="checkbox" id="introPreview" onchange="drawStage()">Preview production intro</label></div><div class="card"><h2>Assigned clips</h2><p class="muted">× removes an assignment; the original clip is retained.</p><div class="row"><select id="assign">${options(P.clips.filter(c=>!p.clips.includes(c.id)),null,'Choose clip')}</select><button onclick="assignClip()">Add</button><button onclick="assignAll()">Add all speaker clips</button></div>${p.clips.map((id,i)=>`<div class="clipline"><span>${esc(P.clips.find(c=>c.id===id)?.title||id)}</span><button onclick="moveClip(${i},-1)">↑</button><button onclick="moveClip(${i},1)">↓</button><button onclick="unassign('${id}')" aria-label="Remove assignment">×</button></div>`).join('')}${select('Output','prod','output',[['both','Short clips + combined production'],['separate','Short clips only'],['together','Combined (short intermediates retained)']])}<p class="muted"><small>Group labels also create joined group videos when combined output is enabled.</small></p></div><div class="card"><h2>Context slides</h2>${select('Intro source','prod','intro_mode',[['clip','Each clip’s own intro'],['production','This production’s intro before each clip'],['none','No intro slides']])}${field('Production intro text','scene','intro.text','textarea')}<div class="grid triple"><div>${field('Duration seconds','scene','intro.duration','number',1,20)}</div><div>${field('Text color','scene','intro.color','color')}</div><div>${field('Slide background','scene','intro.background','color')}</div></div></div></div><div><div class="card"><h2>Figure & label</h2><select onchange="actorId=this.value;renderPage()">${options(p.scene.actors,actorId)}</select><div class="row" style="margin-top:10px"><select id="addActor">${options(P.speakers.filter(s=>!p.scene.actors.some(a=>a.id===s.id)),null,'Add speaker')}</select><button onclick="addActor()">Add</button></div><button style="margin-top:10px" onclick="removeActor()">Remove from scene</button>${activeActor()?actorForm():''}</div><div class="card"><h2>Stage</h2>${field('Background color','scene','background.color','color')}<label>Background image</label><input type="file" accept="image/*" onchange="backgroundFile(this)"><button onclick="put(model('scene'),'background.image_data',null)">Clear image</button><details><summary>Light & shadow</summary><div class="grid">${field('Light X','scene','lighting.x','number',0,1280)}${field('Light Y','scene','lighting.y','number',0,720)}${field('Shading intensity','scene','lighting.intensity','number',0,1)}${field('Shadow opacity','scene','lighting.shadow_opacity','number',0,.6)}${field('Shadow length','scene','lighting.shadow_length','number',0,240)}${field('Shadow blur','scene','lighting.shadow_blur','number',0,60)}</div>${field('Light color','scene','lighting.color','color')}<small>Silhouette shadows and directional tint; no inferred 3D geometry.</small></details><details><summary>Subtitles & audio</summary><div class="grid">${field('Subtitle X','scene','subtitles.x','number',0,1280)}${field('Subtitle Y','scene','subtitles.y','number',0,700)}${field('Subtitle width','scene','subtitles.width','number',200,1200)}${field('Font size','scene','subtitles.size','number',14,48)}</div>${field('Color','scene','subtitles.color','color')}${field('White readability panel','scene','subtitles.panel','checkbox')}${field('Use speaker-specific subtitle colors','scene','subtitles.speaker_colors','checkbox')}${select('Audio processing','scene','audio.mode',[['off','Original'],['cleanup','Denoise + loudness normalization']])}<small>Cleanup cannot recover missing speech detail; this is not generative audio upscaling.</small></details></div></div></div>`:'<p class="empty">Add a speaker, then create a production.</p>'}`}
if(tabName==='Render queue'){html=`<h1>Overnight render queue</h1><p class="muted">Run a short speaking preview for each new puppet before a full queue. GPU jobs run sequentially.</p><div class="card">${P.productions.map(p=>`<label><input type="checkbox" class="queueChoice" value="${p.id}" checked>${esc(p.name)} · ${p.clips.length} clips</label>`).join('')||'<p class="empty">Create a production and assign clips first.</p>'}<div class="row" style="margin:15px 0"><button class="primary" onclick="renderQueue(false)">Render selected productions</button><button onclick="renderQueue(true)">12-second previews</button><button class="danger" onclick="cancelJob()">Stop job</button></div><p id="jobStatus" class="muted"></p><div id="jobLog" class="log">Ready.</div><p class="muted">Windows sounds on completion or failure. Outputs stay in your project’s renders folder. Matching outputs resume; layout changes reuse face inference. Interrupted locks require inspection before restart.</p></div>`}
if(tabName==='Renders'){html=`<h1>Completed renders</h1><p class="muted">Play previews, short clips and joined productions from this project. Internal face caches and speech chunks stay out of this list.</p><div class="card"><div class="row"><select id="renderProduction" aria-label="Filter by production" onchange="renderFilter=this.value;renderGalleryList()"></select><select aria-label="Filter by output type" onchange="renderType=this.value;renderGalleryList()"><option value="">All outputs</option>${['clip','preview','combined','group','version'].map(k=>`<option value="${k}" ${renderType===k?'selected':''}>${k==='version'?'Retained versions':k[0].toUpperCase()+k.slice(1)}</option>`).join('')}</select><button onclick="loadRenders()">Refresh</button></div><label><input id="renderHistory" type="checkbox" ${renderHistory?'checked':''} onchange="renderHistory=this.checked;loadRenders()">Include retained render versions</label></div><div id="renderPlayer" class="card" hidden><h2 id="playingTitle"></h2><video id="completedVideo" controls preload="metadata"></video><p id="playingDetails" class="muted"></p></div><div id="renderList" aria-live="polite"><p class="empty">Loading completed outputs…</p></div>`}
if(tabName==='Advanced'){html=`<h1>Advanced settings</h1><p class="muted">Optional provider settings stay out of the main workflow. Compatible endpoints are configurable; individual providers may differ.</p><div class="card"><h2>Check your setup</h2><p class="muted">Read-only checks. No packages or model environments are changed. Results appear in Render queue.</p><div class="row"><button onclick="act('diagnose',{model:false})">Check Studio setup</button><button onclick="act('diagnose',{model:true})">Check model environment</button></div><details><summary>Animation environment</summary>${select('Backend','cfg','backend',[['sadtalker','SadTalker speaking face'],['still','Still face: composition and gesture tests']])}${field('Existing SadTalker checkout','cfg','sadtalker_repo')}${field('Existing CUDA environment python.exe','cfg','sadtalker_python')}${field('Expression scale','cfg','expression_scale','number',.5,2)}${field('Inference chunk seconds','cfg','chunk_seconds','number',15,120)}<p class="muted">Studio leaves the CUDA environment alone. Workers use 256-pixel, batch-size-one inference suitable for a 4 GB GPU. Long speeches retain chunks and assemble a continuous final clip.</p></details><details><summary>Transcription & clip planning</summary>${select('Transcription','cfg','transcription',[['local','Local Whisper CPU'],['api','Compatible API: sends audio'],['huggingface','Hugging Face hosted ASR: sends audio']])}${hfSettings()}${field('Local Whisper model / model directory','cfg','whisper_model')}${field('Language code (blank detects)','cfg','language')}${field('API transcription model','cfg','transcription_model')}${select('Clip proposals','cfg','planning',[['rules','Local sentence/pause rules'],['api','Semantic chat API: sends transcript']])}${field('Target clip seconds','cfg','target_seconds','number',10,600)}${field('Maximum clip seconds','cfg','max_seconds','number',20,1800)}<p class="muted">API audio is limited to 24 MiB in this adapter. Word timestamps use whisper-1 on OpenAI. Speaker diarization is not included; assign speakers during review.</p></details><details><summary>Optional API & image generation</summary>${field('API base URL (OpenAI-compatible routes)','cfg','api_base')}${field('Key environment-variable NAME','cfg','key_env')}${field('Chat model','cfg','chat_model')}${field('Image edit model','cfg','image_model')}${field('Art style prompt','cfg','style','textarea')}<p class="muted">Set the actual key in the launch terminal, not in project files. Provider-backed actions can incur charges and send the audio, transcript or reference image specified by that action.</p><pre>$env:STUDIO_API_KEY = "your key"
.\launch.cmd</pre><small>Draft generation is optional. Generated art still needs review, registration for additional poses, and anatomy calibration.</small></details></div>`}
$('main').innerHTML=html;if(tabName==='Getting started'&&!machine)loadMachine();if(tabName==='Productions'&&production()){bindStage();drawStage()}if(tabName==='Render queue')updateJob();if(tabName==='Renders')loadRenders()}
function setEmphasisPhrases(value){put(model('actor'),'gestures.phrases',value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean))}
function actorForm(){let a=activeActor();return `${field('Show figure','actor','visible','checkbox')}${field('Mirror figure','actor','mirror','checkbox')}<div class="grid triple">${field('Center X','actor','x','number',0,1280)}${field('Feet Y','actor','y','number',0,720)}${field('Height','actor','height','number',100,720)}</div>${field('Display name','actor','name')}${field('Title','actor','title')}${field('Show label','actor','label.visible','checkbox')}<div class="grid">${field('Label X','actor','label.x','number',0,1280)}${field('Label Y','actor','label.y','number',0,720)}${field('Label width','actor','label.width','number',100,1200)}${field('Name font size','actor','label.name_size','number',12,72)}${field('Title font size','actor','label.title_size','number',10,48)}</div><div class="grid triple">${field('Name color','actor','label.color','color')}${field('Title color','actor','label.title_color','color')}${field('Subtitle color','actor','label.subtitle_color','color')}</div><details ${a.gestures.mode==='manual'?'open':''}><summary>Motion & gestures</summary><p class="muted">Off disables gestures. Timed randomness chooses gaps between attempts; Emphasis phrases uses matching subtitle text; Phrases + timed combines both. Probability is the chance an automatic attempt is used (1 = always). Seed makes the same inputs repeatable. Hold limits control automatic gesture length, including transitions. Automatic gestures stay within speaking windows; manual cues use your exact times.</p>${select('Gesture mode','actor','gestures.mode',[['off','Off'],['timed','Timed randomness'],['phrases','Emphasis phrases'],['hybrid','Phrases + timed'],['manual','Manual cues']])}<div class="grid">${field('Min interval seconds','actor','gestures.interval_min','number',5,180)}${field('Max interval seconds','actor','gestures.interval_max','number',5,180)}${field('Probability','actor','gestures.probability','number',0,1)}${field('Seed','actor','gestures.seed','number',0,2147483647)}${field(' function manualCueRows(a){return a.gestures.cues.map((c,i)=>`<div class="card"><p class="muted">${c.clip?esc(P.clips.find(x=>x.id===c.clip)?.title||c.clip):'Every clip in this production (legacy cue)'}</p><div class="grid triple"><div><label>Start (seconds into clip)</label><input type="number" min="0" step="0.01" value="${c.start}" onchange="editManualCue(${i},'start',+this.value)"></div><div><label>End (seconds into clip)</label><input type="number" min="0" step="0.01" value="${c.end}" onchange="editManualCue(${i},'end',+this.value)"></div><div><label>Gesture pose</label><select onchange="editManualCue(${i},'pose',this.value)">${options(P.speakers.find(s=>s.id===a.id).poses,c.pose)}</select></div></div><button onclick="activeActor().gestures.cues.splice(${i},1);changed();renderCueList()">Remove cue</button></div>`).join('')||'<p class="muted">No manual cues yet.</p>'}

function bindStage(){let c=$('stage'),point=e=>{let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*1280/r.width,y:(e.clientY-r.top)*720/r.height}};c.onpointerdown=e=>{let pt=point(e),contains=r=>pt.x>=r.x&&pt.x<=r.x+r.w&&pt.y>=r.y&&pt.y<=r.y+r.h,hit=regions.find(r=>r.type.endsWith('-corner')&&contains(r))||[...regions].reverse().find(contains);if(!hit)return;drag={hit,pt,scene:JSON.parse(JSON.stringify(production().scene))};if(hit.id)actorId=hit.id;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;let pt=point(e),dx=pt.x-drag.pt.x,dy=pt.y-drag.pt.y,s=production().scene,o=drag.scene,r=drag.hit,a=s.actors.find(a=>a.id===r.id),old=o.actors.find(a=>a.id===r.id),cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));if(r.type==='figure'){a.x=cl(old.x+dx,0,1280);a.y=cl(old.y+dy,0,720)}else if(r.type==='figure-corner')a.height=cl(old.height+(drag.pt.y<old.y-old.height/2?-dy:dy),100,720);else if(r.type==='label'){a.label.x=cl(old.label.x+dx,0,1280);a.label.y=cl(old.label.y+dy,0,720)}else if(r.type==='label-corner'){a.label.width=cl(old.label.width+(drag.pt.x>old.label.x+old.label.width/2?dx:-dx),100,1200);a.label.name_size=cl(old.label.name_size+dy*.15,12,72);a.label.title_size=cl(old.label.title_size+dy*.1,10,48)}else if(r.type==='subtitle'){s.subtitles.x=cl(o.subtitles.x+dx,0,1280);s.subtitles.y=cl(o.subtitles.y+dy,0,700)}else if(r.type==='subtitle-corner'){s.subtitles.width=cl(o.subtitles.width+(drag.pt.x>o.subtitles.x?dx:-dx)*2,200,1200);s.subtitles.size=cl(o.subtitles.size+dy*.2,14,48)}else if(r.type==='light'){s.lighting.x=cl(o.lighting.x+dx,0,1280);s.lighting.y=cl(o.lighting.y+dy,0,720)}changed();drawStage()};c.onpointerup=()=>{drag=null;renderPage()}}

function renderDuration(seconds){if(seconds==null)return '';let t=Math.round(seconds);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
async function loadRenders(){let seq=++gallerySeq;try{let data=await api('renders?history='+(renderHistory?1:0));if(tabName!=='Renders'||seq!==gallerySeq)return;renderItems=data.renders;let names=new Map(renderItems.map(r=>[r.production_id,r.production_name]));$('renderProduction').innerHTML='<option value="">All productions</option>'+[...names].map(([id,name])=>`<option value="${esc(id)}" ${id===renderFilter?'selected':''}>${esc(name)}</option>`).join('');renderGalleryList()}catch(e){if(tabName==='Renders'&&$('renderList'))$('renderList').innerHTML='<p class="empty">'+esc(e.message)+'</p>';toast(e.message,true)}}
function renderGalleryList(){if(!$('renderList'))return;let list=renderItems.map((r,i)=>({r,i})).filter(({r})=>(!renderFilter||r.production_id===renderFilter)&&(!renderType||r.kind===renderType));$('renderList').innerHTML=list.map(({r,i})=>{let url=file(r.path),kind=r.kind==='version'?'Retained version':r.kind==='combined'?'Combined production':r.kind==='group'?'Speech group':r.kind==='preview'?'Preview':'Clip';return `<div class="card"><div class="row"><h2 style="flex:1">${esc(r.title)}</h2><span class="muted">${kind}${r.preview&&r.kind!=='preview'?' · preview':''}</span></div><p class="muted">${esc(r.production_name)} · ${renderDuration(r.duration)}${r.duration!=null?' · ':''}${(r.size_bytes/1048576).toFixed(1)} MiB · ${esc(new Date(r.modified*1000).toLocaleString())}</p><div class="row"><button class="primary" onclick="playRender(${i})">Play</button><a href="${esc(url)}" target="_blank" rel="noopener">Open video</a><a href="${esc(url+'&download=1')}" download>Download</a></div><p class="muted"><small>${esc(r.path)}</small></p></div>`}).join('')||'<p class="empty">No completed outputs match this view. Finish a render, then click Refresh.</p>'}
function playRender(index){let r=renderItems[index];if(!r)return;$('renderPlayer').hidden=false;$('playingTitle').textContent=r.production_name+' — '+r.title;let video=$('completedVideo');video.src=file(r.path);video.onloadedmetadata=()=>{$('playingDetails').textContent=renderDuration(video.duration)+' · '+r.path};video.play().catch(()=>{});$('renderPlayer').scrollIntoView?.({behavior:'smooth',block:'start'})}

function renderQueue(preview){let ids=[...document.querySelectorAll('.queueChoice:checked')].map(e=>e.value);if(!ids.length){toast('Select a production.',true);return}act('render',{productions:ids,preview})}async function cancelJob(){if(confirm('Stop this job and child processes? Completed outputs remain; interrupted locks may require inspection.')){try{await api('cancel',{});toast('Stopping job.')}catch(e){toast(e.message,true)}}}
function updateJob(){let banner=$('globalJob');banner.hidden=!job;if(job)banner.textContent=job.action+' · '+job.status+' · view progress';if(!job)return;if($('jobStatus'))$('jobStatus').textContent=job.action+' · '+job.status+' · '+Math.round((Date.now()/1000-job.started)/60)+' min';if($('jobLog')){$('jobLog').textContent=job.lines.join('\n')||'Starting…';$('jobLog').scrollTop=$('jobLog').scrollHeight}if(job.status!=='running'&&finishedJob!==job.id){finishedJob=job.id;toast('Job '+job.status+'. Results/reports are in the project folder.',job.status!=='completed');if(tabName==='Renders'&&job.action==='render')loadRenders();else if(!dirty)refresh().catch(e=>toast(e.message,true))}}
initializeTheme();
setInterval(async()=>{try{let d=await api('job');job=d.job;updateJob()}catch(e){}},2500);window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};refresh().catch(e=>toast(e.message,true));
</script></body></html>
